# pnpm runs no dependency build scripts unless they are listed here.
# Electron needs none: it downloads its binary the first time it is started.
allowBuilds:
  # Squirrel.Windows installer tooling pulled in by electron-builder; unused (no installers yet).
  electron-winstaller: false
# PDF.js (pdfjs-dist) can use this native canvas package to draw pages; the app only reads
# their text, and the main-process bundle could not load a native module anyway.
ignoredOptionalDependencies:
  - "@napi-rs/canvas"
