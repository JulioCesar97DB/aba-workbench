# Runs the same checks every pull request has passed by hand, on Linux, Windows
# and macOS: install, lint, typecheck, unit tests, the Electron app's build, the
# Phase 0 run on the mock provider, the window tests (Playwright driving the
# Electron app), packaging the unpacked app, and the window tests again on it. It uses no secrets and no API keys, and nothing in it calls a
# real provider: the only provider the window can reach is the mock.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# The token only needs to read the repository.
permissions:
  contents: read

# Pull requests: each pull request has one group, and a new push cancels the
# run it supersedes, whether that run is in progress or still pending.
# Pushes to dev and main: each run gets a group of its own (its run id), so no
# other run can queue behind it or replace it. GitHub keeps only one pending
# run per group, so a shared group per branch would cancel the middle one of
# three quick merges and leave that commit without a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      # One system's failure must not cancel or hide the others'.
      fail-fast: false
      matrix:
        # Pinned images, not -latest, so a runner upgrade is a deliberate change.
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # The same shell everywhere (Git Bash on Windows), so every step reads the same.
        shell: bash
    steps:
      # Actions are pinned to a full commit SHA; the comment names the release.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm at the version in package.json's packageManager field and
      # Node.js at the version in .nvmrc, then runs
      # `pnpm install --frozen-lockfile` (require-lockfile).
      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          require-lockfile: true
          cache: true
          # Only runs on dev and main save the store; pull requests restore it.
          save-cache: ${{ github.event_name == 'push' }}

      # Shows which Node.js and pnpm the later steps use, so the log proves that
      # the version from .nvmrc, not the runner's preinstalled one, runs them.
      - name: Show Node.js and pnpm versions
        run: |
          command -v node
          node --version
          pnpm --version

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # electron-vite builds the main process, the preload and the interface into out/.
      - name: Build the Electron app
        run: pnpm build

      # The provider layer called directly, against the mock provider: no keys, no spend.
      - name: Phase 0 end-to-end run (mock provider)
        run: pnpm phase0 --mock

      # Linux only: Ubuntu 24.04 stops unprivileged user namespaces through AppArmor,
      # which Chromium's sandbox needs; without this Electron refuses to start. The
      # app keeps its sandbox on; this changes the runner, not the app.
      - name: Let Chromium's sandbox run (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Downloads Electron's binary, builds the app and drives its window with
      # Playwright. Linux runners have no display: xvfb-run (preinstalled on the
      # image) gives the window a virtual one.
      - name: Window tests (Playwright, Electron)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm test:e2e
          else
            pnpm test:e2e
          fi

      # Assembles the unpacked app for this system with electron-builder (dist/): no
      # installer, no certificate (macOS gets an ad-hoc signature, mac identity "-" in
      # electron-builder.yml; no signing certificate is configured for Windows), no secrets.
      - name: Package the app (unpacked, no certificate)
        run: pnpm package

      # The same window tests, against the packaged app: it starts from dist/ and finds
      # its rules in its own resources folder.
      - name: Window tests on the packaged app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm test:e2e:packaged
          else
            pnpm test:e2e:packaged
          fi
